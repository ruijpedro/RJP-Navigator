name: Importar cartografia IP rodoviária (experimental)
on:
  push:
    branches: [feature/ip-rail-engine]
    paths:
      - .github/workflows/import-ip-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter branch experimental
        uses: actions/checkout@v4
        with:
          ref: feature/ip-rail-engine
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências SIG
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1 pyproj==3.7.2
      - name: Converter dados oficiais
        run: python scripts/import-ip-road.py
      - name: Validar geometria nacional
        run: |
          python - <<'PY'
          import json
          p='public/data/ip/road.json'
          d=json.load(open(p,encoding='utf8'))
          assert len(d)>25000, len(d)
          assert all(x.get('points') and len(x['points'])>=2 for x in d)
          assert all('bbox' in x for x in d)
          print('Dados rodoviários validados:',len(d))
          PY
      - name: Guardar apenas na branch experimental
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ip/road.json
          if git diff --cached --quiet; then
            echo "Sem alterações no inventário rodoviário"
          else
            git commit -m "Import IP road geometries for experimental offline build"
            git push origin HEAD:feature/ip-rail-engine
          fi
