name: RJP Auto - Criar chave de upload (segura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-chave:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gerar chave e backup encriptado
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RJP_PLAY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RJP_PLAY_KEY_PASSWORD }}
          BACKUP_PASSWORD: ${{ secrets.RJP_PLAY_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in STORE_PASSWORD KEY_PASSWORD BACKUP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta um dos segredos de assinatura ou backup. Consulta o guia."
              exit 1
            fi
          done
          if [[ "${#STORE_PASSWORD}" -lt 12 || "${#KEY_PASSWORD}" -lt 12 || "${#BACKUP_PASSWORD}" -lt 16 ]]; then
            echo "::error::Usa passwords de assinatura com 12+ caracteres e de backup com 16+."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rjp-key" "$GITHUB_WORKSPACE/secure-backup"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/rjp-key/rjp-auto-upload.jks" \
            -storetype JKS \
            -alias rjpauto \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=RJP Navigator Auto, OU=Android, O=RJP, C=PT" \
            -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD
          keytool -list -keystore "$RUNNER_TEMP/rjp-key/rjp-auto-upload.jks" -storepass:env STORE_PASSWORD >/dev/null
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/rjp-key/rjp-auto-upload.jks" \
            -out "$GITHUB_WORKSPACE/secure-backup/rjp-auto-upload.jks.enc" \
            -pass env:BACKUP_PASSWORD
          test -s "$GITHUB_WORKSPACE/secure-backup/rjp-auto-upload.jks.enc"
          echo "Chave criada; backup AES-256 encriptado. Descarrega o artifact e guarda-o em segurança."
      - name: Disponibilizar APENAS o backup encriptado
        uses: actions/upload-artifact@v4
        with:
          name: RJP_Auto_Keystore_Backup_Encriptado
          path: secure-backup/rjp-auto-upload.jks.enc
          if-no-files-found: error
          retention-days: 1
      - name: Eliminar ficheiros temporarios
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/rjp-key" "$GITHUB_WORKSPACE/secure-backup"
