name: Build RJP Navigator APK V3.10

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A versão antiga do repositório tem um package-lock.json com URLs
      # de um registry privado/inacessível. O npm 10 pode falhar com
      # "Exit handler never called!" ao tentar reutilizá-lo.
      - name: Limpar instalação npm antiga
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Instalar dependências da V3.10
        run: npm install --include=dev --no-audit --no-fund --legacy-peer-deps --package-lock=false --fetch-retries=4

      - name: Executar testes
        run: npm test

      - name: Validar cartografia IP incluída no repositório (offline)
        env:
          RJP_REQUIRE_MAPS: '1'
        run: npm run prepare:maps

      - name: Gerar WebApp
        run: npm run build

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar SDK Android (sem pacote tools obsoleto)
        uses: android-actions/setup-android@v3
        with:
          # O valor predefinido da action inclui `tools`, removido do SDK.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Criar projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Permissões de GPS e Internet
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf8')
          items=['<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
                 '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
                 '<uses-permission android:name="android.permission.INTERNET" />',
                 '<uses-feature android:name="android.hardware.location.gps" android:required="false" />']
          m=re.search(r'<manifest\b[^>]*>',s)
          if not m: raise SystemExit('Tag manifest em falta')
          missing=[x for x in items if x not in s]
          s=s[:m.end()]+'\n    '+'\n    '.join(missing)+s[m.end():] if missing else s
          p.write_text(s,encoding='utf8')
          PYANDROID

      - name: Aplicar ícone RJP
        run: |
          mkdir -p android/app/src/main/res
          cp -R android-res/* android/app/src/main/res/
          sed -i 's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RJP_Navigator_V3_10_APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpar instalação npm antiga
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm config set registry https://registry.npmjs.org/

      - name: Instalar dependências da V3.10
        run: npm install --include=dev --no-audit --no-fund --legacy-peer-deps --package-lock=false --fetch-retries=4

      - name: Executar testes
        run: npm test

      - name: Validar cartografia IP incluída no repositório (offline)
        env:
          RJP_REQUIRE_MAPS: '1'
        run: npm run prepare:maps

      - name: Gerar WebApp
        run: npm run build

      - name: Publicar WebApp
        uses: actions/upload-artifact@v4
        with:
          name: RJP_Navigator_V3_10_WebApp
          path: dist/
          if-no-files-found: error
