name: Build RJP Navigator APK V3.2
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Executar testes
        run: npm test
      - name: Gerar WebApp
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
      - name: Criar projeto Android
        run: npx cap add android
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Permissões de GPS e Internet
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf8')
          items=['<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
                 '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
                 '<uses-permission android:name="android.permission.INTERNET" />',
                 '<uses-feature android:name="android.hardware.location.gps" android:required="false" />']
          m=re.search(r'<manifest\b[^>]*>',s)
          if not m: raise SystemExit('Tag manifest em falta')
          missing=[x for x in items if x not in s]
          s=s[:m.end()]+'\n    '+'\n    '.join(missing)+s[m.end():] if missing else s
          p.write_text(s,encoding='utf8')
          PYANDROID
      - name: Aplicar ícone RJP
        run: |
          cp -R android-res/* android/app/src/main/res/
          sed -i 's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RJP_Navigator_V3_2_APK
          path: android/app/build/outputs/apk/debug/*.apk
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: RJP_Navigator_V3_2_WebApp
          path: dist/
