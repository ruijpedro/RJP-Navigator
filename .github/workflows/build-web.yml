name: Build RJP Navigator WebApp V4.2.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/build-web.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Evita reutilizar package-lock.json antigo contendo URLs de registry privado.
      - name: Limpar dependências antigas
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          rm -rf node_modules package-lock.json
          npm config set registry https://registry.npmjs.org/

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund --legacy-peer-deps --package-lock=false --fetch-retries=4

      - name: Repor dados e funções V4.0 (103 PN e cartografia IP)
        run: npm run repair:data

      - name: Verificar a rede ferroviária nacional integrada
        run: npm run verify:network

      - name: Executar testes
        run: npm test

      - name: Recolher e validar os marcos PK nacionais (OSM)
        run: |
          npm run prepare:pk
          npm run verify:pk

      - name: Preparar cartografia de arranque
        run: npm run prepare:maps

      - name: Compilar WebApp
        run: npm run build

      - name: Verificar saída
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/data/rede-ferroviaria-nacional.json && test -s dist/data/referencias-pk-rfn.json
          echo 'WebApp V4.2.3 compilada:'
          ls -lah dist/

      - name: Disponibilizar WebApp para descarregar
        uses: actions/upload-artifact@v4
        with:
          name: RJP_Navigator_V4_2_3_WebApp
          path: dist/
          if-no-files-found: error
          retention-days: 30
